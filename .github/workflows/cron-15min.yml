name: cron-15min

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: sync-campaign-metrics
        run: curl -sf -X GET "https://lunaads.vercel.app/api/cron/sync-campaign-metrics" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: sync-rejections
        run: curl -sf -X GET "https://lunaads.vercel.app/api/cron/sync-rejections" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
