name: cron-daily

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: cleanup-hardening
        run: curl -sf -X GET "https://lunaads.vercel.app/api/cron/cleanup-hardening" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
